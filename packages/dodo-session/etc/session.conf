#
# Dodo session settings for this machine. A user can override any key in
# ~/.config/dodo/session.conf. Output names: see "wlr-randr" in the session.
#
# Monitor for the desktop icons (one name, or several separated by commas: the first present wins).
# Empty: libxfce4windowing guesses (a laptop panel, else the output at 0,0).
#primary = NAME
#
# A monitor whose windows show on every desktop, while the other monitors switch desktops.
# Empty: switching desktops switches every monitor.
#pinned = NAME
